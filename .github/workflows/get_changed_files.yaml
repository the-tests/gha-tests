name: "Lint and Format"

on:
  pull_request:
    branches:
      - dev

jobs:
  get_files:
    runs-on: ubuntu-latest
    name: "GET FILES"
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get changes
        shell: bash
        run: |
          echo "$(git diff --name-only HEAD^1 HEAD)" >> $GITHUB_STEP_SUMMARY