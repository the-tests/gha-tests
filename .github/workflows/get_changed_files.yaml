name: "Get files"

on:
  pull_request:
    branches:
      - dev

jobs:
  get_files:
    runs-on: ubuntu-latest
    name: "GET FILES"
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: get files
        id: files
        uses: jitterbit/get-changed-files@v1
        with:
          format: 'json'

  print_each_file:
    runs-on: ubuntu-latest
    name: "GET FILES"
    strategy:
    matrix:
      service: ${{ needs.get_files.steps.files.outputs.all }}
    steps:
      - name: print ${{ matrix.service }}
        run: |
          printf '\n```\n' >> $GITHUB_STEP_SUMMARY
          printf '${{ steps.files.outputs.all }}' | jq  >> $GITHUB_STEP_SUMMARY
          printf '\n```\n' >> $GITHUB_STEP_SUMMARY
